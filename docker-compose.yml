# Management-plane only. Do not attach this stack to a VLAN 7 / bait bridge.
# Dashboard is bound to loopback — reach it via SSH tunnel or VPN, never from bait NICs.

services:
  api:
    build:
      context: ./backend
    container_name: hive-api
    env_file: .env
    environment:
      HIVE_DB_PATH: /data/hive.sqlite
      HIVE_GEOIP_CITY: /geoip/GeoLite2-City.mmdb
      HIVE_GEOIP_ASN: /geoip/GeoLite2-ASN.mmdb
      HIVE_SENSORS_FILE: /app/sensors.yaml
    volumes:
      - ./sensors.yaml:/app/sensors.yaml:ro
      - ./data/logs:/logs:ro
      - ./data/geoip:/geoip:ro
      - ./data/db:/data
    networks:
      - hive_mgmt
    restart: unless-stopped
    # No ports: Nginx is the only ingress.

  ui:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
    container_name: hive-ui
    depends_on:
      - api
    ports:
      - "127.0.0.1:8443:80"
    networks:
      - hive_mgmt
    restart: unless-stopped

networks:
  hive_mgmt:
    driver: bridge
    internal: true
